name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Datos + modelo (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas de calidad de datos e inferencia
        run: pytest tests/ -v

  frontend:
    name: Frontend (build de Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Build de producción
        run: npm run build
